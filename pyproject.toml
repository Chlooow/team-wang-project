[project]
name = "team-wang-project"
version = "0.1.0"
description = "Minimal ELT pipeline (dlt + dbt + Dagster) for Shopify historization (SCD2)"
requires-python = ">=3.10"
dependencies = [
  "dagster>=1.8.0",
  "dlt[duckdb]>=0.5.4",
  "dbt-duckdb>=1.8.0",
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
